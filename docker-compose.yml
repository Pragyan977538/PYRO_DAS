services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: firewatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firewatch}
      POSTGRES_USER: ${POSTGRES_USER:-firewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firewatch}
      # India-wide spatial work; keep the planner honest about disk
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - firewatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firewatch} -d ${POSTGRES_DB:-firewatch}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    shm_size: 1gb

  # The API and the map (http://localhost:8000). Reads the database above and the
  # basemap under ./data (make basemap); needs no network once both exist.
  api:
    build: .
    container_name: firewatch-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-firewatch}:${POSTGRES_PASSWORD:-firewatch}@db:5432/${POSTGRES_DB:-firewatch}
      MOCK_MODE: ${MOCK_MODE:-0}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  firewatch_pgdata:
